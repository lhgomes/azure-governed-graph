name: Documentation links (deployment-independent)
on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
      - "scripts/check_doc_links.py"
      - ".github/workflows/docs-links.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository Markdown paths
        run: python scripts/check_doc_links.py
