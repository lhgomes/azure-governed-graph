name: ci
# GitHub is the control plane only. All application tests and Bicep builds run on Azure.
# The gg-ci environment MUST require trusted-reviewer approval and restricted branches.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  azure-validation:
    name: azure-ci-${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: gg-ci
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        profile: [p1, p2]
    env:
      AZURE_CLIENT_ID: ${{ vars.GG_CI_AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.GG_CI_AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.GG_CI_AZURE_SUBSCRIPTION_ID }}
      GG_CI_RESOURCE_GROUP: ${{ vars.GG_CI_RESOURCE_GROUP }}
      GG_CI_ACR_NAME: ${{ vars.GG_CI_ACR_NAME }}
      GG_CI_JOB_NAME: job-gg-ci-validation
      GG_CI_PROFILE: ${{ matrix.profile }}
      EVENT_NAME: ${{ github.event_name }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Reject untrusted fork contexts and missing CI bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request && "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Fork PRs cannot request Azure OIDC. Use a trusted branch and reviewer approval."
            exit 1
          fi
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID GG_CI_RESOURCE_GROUP GG_CI_ACR_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing configured gg-ci variable: $name"
              exit 1
            fi
          done
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Azure sign-in via protected-environment OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Build on ACR, execute in Container Apps Job, verify terminal status
        shell: bash
        run: bash infra/ci/dispatch.sh
