name: ci
# The azure-public label must be assigned only to a verified Azure-hosted runner.
# An unavailable runner leaves checks pending; never fall back to GitHub-hosted execution.
on: [push, pull_request]
jobs:
  test:
    runs-on: [self-hosted, Linux, X64, azure-public]
    env:
      GOVERNEDGRAPH_DATA_DIR: examples/pension_wtp/data
      AZURE_ENV_NAME: gg-dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - run: python -m pip install -r requirements-azure.txt pytest
      - name: Guardrail tests (B1-B10)
        run: |
          python -m pytest
      - name: Simulated evaluation hard gates
        run: python evals/run_evals.py --comparison evals/results/model-comparison-2026-10-27.json
      - name: Automated model suite configuration (static, not live readiness)
        run: python evals/run_model_suite.py --check-config
  bicep:
    runs-on: [self-hosted, Linux, X64, azure-public]
    steps:
      - uses: actions/checkout@v5
      - run: |
          az bicep build --file infra/main.bicep
          az bicep build --file infra/model-evaluation/main.bicep
