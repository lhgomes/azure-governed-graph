name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOVERNEDGRAPH_MODE: local
      GOVERNEDGRAPH_DATA_DIR: examples/pension_wtp/data
      GOVERNEDGRAPH_LOCAL_VALUES_PROVIDER: pension_wtp.member_values_api.data:get_member_values
      GOVERNEDGRAPH_TEXT_DEMO_MODULE: pension_wtp.demo.run_demo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - run: python -m pip install -r requirements-azure.txt
      - name: Guardrail tests (B1-B10)
        run: |
          pytest
          python -m pytest
      - name: Simulated evaluation hard gates
        run: python evals/run_evals.py --comparison evals/results/model-comparison-2026-10-27.json
      - name: Automated model suite configuration (offline, not live readiness)
        run: python evals/run_model_suite.py --check-config
      - name: Offline demo smoke test
        run: PYTHONPATH=src:examples python -m pension_wtp.demo.run_demo
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          az bicep build --file infra/main.bicep
          az bicep build --file infra/model-evaluation/main.bicep
