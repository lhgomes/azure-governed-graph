<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif"><title id="title">How GovernedGraph works</title><desc id="description">Host-controlled member guidance uses Microsoft Decision 1.1 for closed semantic decisions and Foundry prompt agents for explanation, with deterministic gates and durable audit. Approved content and read-only authoritative values are supplied by the adopter. A separate scheduled Azure learning plane uses immutable outcome aggregates, deterministic fairness vetoes, tiered human governance and signed ranking feedback.</desc><defs><marker id="m64748b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker><marker id="m087f82" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#087f82"/></marker><marker id="m946014" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#946014"/></marker><marker id="ma13d5c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#a13d5c"/></marker><marker id="m275d9b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#275d9b"/></marker><marker id="m7044a5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7044a5"/></marker></defs>
